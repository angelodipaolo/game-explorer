<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2000f"/>
      <stop offset="1" stop-color="#c60010"/>
    </linearGradient>
  </defs>
  <!-- FIELD (rx set by build: 112 rounded for favicon, 0 square for apple) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#field)"/>
  <!-- cartridge: notched-top Game Boy style, cream on red -->
  <g>
    <!-- body with clipped top-right corner -->
    <path d="M168 132
             h118 a16 16 0 0 1 11 5 l38 38 a16 16 0 0 1 5 11
             v198 a16 16 0 0 1 -16 16
             h-160 a16 16 0 0 1 -16 -16
             v-236 a16 16 0 0 1 16 -16 z"
          fill="#f6f5f1"/>
    <!-- label -->
    <rect x="176" y="186" width="160" height="96" rx="10" fill="#0f0f10"/>
    <!-- NES-palette stripe on the label -->
    <rect x="176" y="186" width="160" height="18" rx="9" fill="#3cbcfc"/>
    <rect x="176" y="186" width="107" height="18"       fill="#58d854"/>
    <rect x="176" y="186" width="54"  height="18" rx="9" fill="#f8b800"/>
    <!-- connector pins at the base -->
    <g fill="#c9c7c0">
      <rect x="180" y="356" width="12" height="30" rx="3"/>
      <rect x="204" y="356" width="12" height="30" rx="3"/>
      <rect x="228" y="356" width="12" height="30" rx="3"/>
      <rect x="252" y="356" width="12" height="30" rx="3"/>
      <rect x="276" y="356" width="12" height="30" rx="3"/>
      <rect x="300" y="356" width="12" height="30" rx="3"/>
    </g>
  </g>
</svg>
